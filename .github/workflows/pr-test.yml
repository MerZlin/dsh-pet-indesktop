name: PR Test Gate

# PR/push 门禁：测试 + ruff。与三条 build-*.yml（tag/手动触发的打包发布）
# 职责不同——本工作流给每个 PR 提供红绿判定，防止「测试只在本机是财富」。

on:
  pull_request:
  push:
    branches: [main]
  # 手动运行（Actions 页面 → Run workflow）：用于三端跨平台对齐——手动指定
  # source_ref 时三端检出同一棵树。PR 路径不受影响：PR 事件仍检出合并提交
  # （refs/pull/N/merge），保留「集成后才有红绿判定」的语义。
  workflow_dispatch:
    inputs:
      source_ref:
        description: '要验证的 ref/SHA（留空 = 本 workflow 的触发 ref，即默认检出）'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    # 编码隔离（issue #26）：强制 UTF-8，避免中文源码/资源被 legacy 编码二次解码
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      # keyring 在无桌面环境的 runner 上可能弹后端探测；测试不需要真实钥匙串
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR 事件下 github.sha = 合并提交（refs/pull/N/merge），保持「集成后
          # 才能过门」的语义；手动 dispatch 用 source_ref 指向同一棵树，供三端
          # 跨平台对齐。留空即回落 github.sha（= 事件默认检出的那个提交）。
          ref: ${{ github.event.inputs.source_ref || github.sha }}

      # 三端各自记录「这次到底验的是哪棵树」：PR 事件下 checkout HEAD 是合并
      # 提交，与 PR 分支 tip 不是同一个 SHA——报告里要能对账，不能只靠印象。
      - name: Record resolved source SHA
        shell: bash
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          {
            echo "### ${{ matrix.os }} 解析到的源码版本"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| event | ${{ github.event_name }} |"
            echo "| workflow ref | ${{ github.ref }} |"
            echo "| github.sha（PR = 合并提交） | ${{ github.sha }} |"
            echo "| PR head sha（分支 tip） | ${{ github.event.pull_request.head.sha }} |"
            echo "| checkout HEAD | $HEAD_SHA |"
            echo "| checkout HEAD 摘要 | $(git log -1 --format=%s) |"
            echo ""
            echo "PR 事件下 checkout HEAD 是合并提交（集成语义），不等于分支 tip；"
            echo "三端对齐请用手动 dispatch + source_ref 指向同一提交。"
          } >> "$GITHUB_STEP_SUMMARY"

      # PySide6 在 Linux 上 import 需要系统 EGL/GL 等库（与 build-linux.yml 一致）
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 fonts-noto-cjk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # bridge 门禁依赖 `node --test`（Node 20 无 glob，清单硬编码在下面）。
      # 显式固定 Node 版本：runner 预装版本会随时间漂移，门禁口径不能跟着飘。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 三端「这一轮到底装了什么」必须留痕：requirements.txt 全是 `>=` 无上限、
      # 无 lock，三端各自解析最新兼容版；imageio-ffmpeg 每平台是不同的 ffmpeg
      # 构建，是 webm 族时序 flake 的平台差异源。
      - name: Record toolchain versions
        shell: bash
        run: |
          NODE_VERSION="$(node --version)"
          python -m pip freeze > "$RUNNER_TEMP/pip-freeze.txt"
          {
            echo "### ${{ matrix.os }} 工具链"
            echo ""
            echo "- python: $(python --version 2>&1)"
            echo "- node: $NODE_VERSION"
            echo ""
            echo "<details><summary>pip freeze</summary>"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/pip-freeze.txt"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ruff
        run: ruff check pet/ tests/

      # 桥接插件零依赖门禁（2026-09 事故回归防线）：bridge 经 pnpm link: 链进
      # 用户 profile，link 不装依赖、链接目标常是打包版 _internal 副本（无
      # node_modules）——任何外部 bare import 都会让用户开联动后整个 dsh
      # 插件树加载失败。此前这类回归无任何 CI 覆盖。
      # 两层校验：node --test 跑全部 8 个 bridge 契约测试（原地 import 捕获
      # 静态外部依赖回归）；verify_import.mjs 做 hermetic 校验（拷进无
      # node_modules 的临时目录 import + 清单零依赖 + envelope 形状 + 动态
      # import/require 静态禁令 + 临时目录祖先链污染探测）。
      # 注意：新增 bridge 测试文件时必须同步下面的显式清单（Node 20 无 glob）。
      - name: Bridge plugin zero-dependency gate
        run: |
          node --test tests/test_bridge_hardfailure.js tests/test_bridge_instance_scope.js tests/test_bridge_interaction_dedup.js tests/test_bridge_manifest.js tests/test_bridge_question_callid.js tests/test_bridge_retry.js tests/test_bridge_root_control.js tests/test_bridge_user_action_guard.js
          node integrations/dsh-pet-bridge/verify_import.mjs

      # 捕获方式按 OS 分流（2026-10-12）：Linux 主套件加 --capture=tee-sys，
      # Windows/macOS 保持默认 fd 捕获 + -q。默认 fd 捕获把 fd 1/2 重定向到临时文件，
      # 于是**直接写 fd 的原生输出**（glibc 的 abort 文本、Qt 默认消息处理器、pytest
      # faulthandler 插件在 pytest_configure 里 os.dup 的那份 fd 2 转储）全落进临时
      # 文件；进程被原生信号杀死时那份临时文件从不进日志——这正是 Linux 连续两轮
      # abort 日志里一行原生栈都没有的原因（取证见 .scratch/ci243/
      # WIN-LINUX-NATIVE-CRASH-FINDINGS-2026-10-11.md §3.4/§7.2b）。
      # tee-sys 只替换 sys.stdout/stderr（tee 把同一份写回真流）**不碰 fd**，原生输出
      # 直接进 CI 日志；Python 层输出照旧被捕获，capsys/capsysbinary 夹具自己起
      # SysCapture、语义不变（本仓无 capfd 用例，也没有进程内读 stdin 的用例：
      # sys.stdin 只出现在子进程脚本里）。
      # 只给 Linux 加这一口：按 OS 条件内联拼出**同一条命令**，不复制出第二个主套件
      # 步骤——主套件单跑就是 13-15 分钟（round3 实测 mac 13:10 / Windows 15:18）。
      # id 供下面那条诊断步骤按 `steps.main_suite.outcome` 判定「红的正是主套件」。

      # 【诊断分支专用，勿合并】Windows 主套件按收集序拆 4 片独立进程跑：
      # 崩溃/失败归属到片，定位 AV 的腐蚀源域。
      - name: Pytest (main suite, Windows monolithic disabled for shard diag)
        if: ${{ runner.os != 'Windows' }}
        id: main_suite
        run: python -m pytest -q --ignore=tests/test_webm_reader_lifecycle.py --ignore=tests/test_webm_clip_lifecycle.py --ignore=tests/test_webm_first_frame_lock.py --ignore=tests/test_low_priority_warm_interaction_yield.py

      - name: Pytest shard Q1 (Windows diag)
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        id: shard1
        run: python -m pytest -q --ignore=tests/test_ci_workflows.py tests/test_agent_cost.py tests/test_agent_event_protocol.py tests/test_agent_link.py tests/test_agent_link_dep_specs.py tests/test_agent_link_subtraction.py tests/test_agent_link_threads.py tests/test_agent_settings_hot_reload.py tests/test_alert_queue.py tests/test_animation_icon_worker_lifecycle.py tests/test_animation_menu_close_and_group.py tests/test_animation_prewarm_phase2.py tests/test_animation_thumbnail_cache.py tests/test_api_provider_list.py tests/test_app_lazy_imports.py tests/test_app_startup_fallback.py tests/test_architecture.py tests/test_autostart.py tests/test_background_service_gates.py tests/test_balance.py tests/test_bubble_subtitle_budget.py tests/test_bubble_text_scale.py tests/test_bundle_encoding_check.py tests/test_bundle_slim.py tests/test_chat_attachments.py tests/test_chat_markdown.py tests/test_chat_safe_emit.py tests/test_chat_service.py tests/test_chat_shared_behavior.py tests/test_chat_subsystem.py tests/test_chat_themes.py tests/test_chat_thinking_web_search.py tests/test_chat_time_awareness.py tests/test_chat_timeline_scroll.py tests/test_child_bubble_quick_chat.py tests/test_ci_workflows.py tests/test_cleanup_mei_cache_cli.py tests/test_click_self_talk_speech.py tests/test_click_sound.py tests/test_click_talk_dialog.py tests/test_clip_current_image.py tests/test_clip_restart_paths.py tests/test_collision.py tests/test_collision_debounce_timebase.py tests/test_config_concurrent_save.py tests/test_config_instance.py tests/test_config_key_migration.py tests/test_config_reload_null.py tests/test_config_schema.py tests/test_config_sound.py tests/test_config_write_lock.py tests/test_context_menu_lifecycle.py tests/test_context_menu_position.py tests/test_convert_frameseq.py tests/test_cursor_visibility.py tests/test_dead_target_frame_callbacks.py tests/test_decode_fanout.py tests/test_decode_fanout_integration.py tests/test_desktop_pet_features.py tests/test_drag_collision_velocity.py tests/test_drag_move_coalescing.py tests/test_drop_gravity_toggle.py tests/test_dsh_mid_attach_done.py tests/test_dsh_state.py tests/test_dynamic_island_balance_tier_time.py tests/test_dynamic_island_bump_convergence.py tests/test_dynamic_island_multiscreen_release.py tests/test_dynamic_island_revamp.py tests/test_edge_probe.py tests/test_edge_reachability.py tests/test_effects_integration.py tests/test_feature_gating.py tests/test_festival.py tests/test_ffmpeg_hide.py tests/test_ffmpeg_job_object.py tests/test_file_eater.py tests/test_file_interpret.py tests/test_final_cleanup_boundaries.py tests/test_final_interaction_regressions.py tests/test_first_batch_features.py tests/test_first_frame_budget.py tests/test_first_frame_no_gui_decode.py tests/test_fix_bridge_bundle.py tests/test_flight_bubble_suppression.py tests/test_flight_frame_pacing.py tests/test_foreground_steal.py tests/test_fps_monitor.py tests/test_fps_permission.py tests/test_frame_path_waste.py tests/test_frameseq_bundle_gate.py

      - name: Pytest shard Q2 (Windows diag)
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        id: shard2
        run: python -m pytest -q --ignore=tests/test_ci_workflows.py tests/test_frameseq_bundle_gate.py tests/test_frameseq_clip.py tests/test_frameseq_no_console.py tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_provision.py tests/test_frameseq_unblend.py tests/test_frameseq_unblend_v3.py tests/test_frameseq_unblend_v4.py tests/test_g2_alert_lifecycle.py tests/test_g2_event_delivery.py tests/test_g2_handoff_and_repeat.py tests/test_game_fps.py tests/test_game_fps_exit_teardown.py tests/test_golden_spin.py tests/test_golden_spin_retarget.py tests/test_gpu_monitor.py tests/test_harness_launcher.py tests/test_harness_lifecycle.py tests/test_harness_ownership.py tests/test_idle_low_fps.py tests/test_input_controller_drag.py tests/test_input_controller_poll_tiers.py tests/test_instance_offset.py tests/test_interaction_identity_ambiguity.py tests/test_island_alert_colors.py tests/test_island_bevel_fade.py tests/test_island_bridge.py tests/test_island_bridge_velocity.py tests/test_island_card_sections.py tests/test_island_chat.py tests/test_island_chat_identity.py tests/test_island_collision.py tests/test_island_content_cache.py tests/test_island_device_slot.py tests/test_island_dock_sampling.py tests/test_island_extension_chain.py tests/test_island_extension_host.py tests/test_island_extension_recovery.py tests/test_island_fps_integration.py tests/test_island_fps_slot.py tests/test_island_gpu_integration.py tests/test_island_gpu_placeholder.py tests/test_island_icon_routing.py tests/test_island_layout_audit.py tests/test_island_metrics_config.py tests/test_island_network_envelope.py tests/test_island_network_slot.py tests/test_island_review_fixes.py tests/test_island_segment_extension.py tests/test_island_segment_render.py tests/test_island_segments.py tests/test_island_shell_wiring.py tests/test_island_shrink_pipeline.py tests/test_island_status_dot.py tests/test_island_topmost.py tests/test_island_unit_box.py tests/test_library_idle_frame_trim.py tests/test_library_priority_warm.py tests/test_library_shared_media.py tests/test_library_warm_priority.py tests/test_lyric_sources.py tests/test_macos_activation.py tests/test_mem_debug.py tests/test_mem_probe_census.py tests/test_memory_trim.py tests/test_menu_layout.py tests/test_menu_toggle_spec.py tests/test_menu_tree_release.py tests/test_meta_cache_budget.py tests/test_meta_no_gui_probe.py tests/test_module_level_validation.py tests/test_move_direction.py tests/test_move_sync.py tests/test_movement.py tests/test_multi_screen_interaction.py tests/test_music_detect.py tests/test_music_lyric.py tests/test_music_player_cache.py tests/test_music_player_settings.py tests/test_music_sing_grace.py

      - name: Pytest shard Q3 (Windows diag)
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        id: shard3
        run: python -m pytest -q --ignore=tests/test_ci_workflows.py tests/test_music_sing_grace.py tests/test_music_sing_timer.py tests/test_music_title.py tests/test_net_monitor.py tests/test_network_info.py tests/test_network_info_dialog.py tests/test_network_info_menu.py tests/test_now_playing_media_type.py tests/test_now_playing_session.py tests/test_now_playing_session_probe.py tests/test_orphan_registry_thread.py tests/test_overlay_app_hosts.py tests/test_overlay_bubble_wiring.py tests/test_overlay_chat_proactive.py tests/test_overlay_collision_toggle.py tests/test_overlay_command_concurrency.py tests/test_overlay_dead_switches.py tests/test_overlay_geometry_parity.py tests/test_overlay_golden_spin_click.py tests/test_overlay_hardening.py tests/test_overlay_hidden_polling.py tests/test_overlay_instance_gate.py tests/test_overlay_lifecycle_gaps.py tests/test_overlay_music_sing.py tests/test_overlay_per_slot_settings.py tests/test_overlay_peripherals.py tests/test_overlay_profile_reset.py tests/test_overlay_recycle_settings.py tests/test_overlay_screen_migration.py tests/test_overlay_self_talk.py tests/test_overlay_self_talk_image_cache.py tests/test_overlay_settings_command.py tests/test_overlay_settings_unavailable_feedback.py tests/test_overlay_shell.py tests/test_overlay_shell_event_filter.py tests/test_overlay_spawn.py tests/test_overlay_spawn_state.py tests/test_overlay_sprite_settings.py tests/test_overlay_tray_icon.py tests/test_overlay_tray_routing.py tests/test_overlay_window.py tests/test_overlay_window_capabilities.py tests/test_perfstats.py tests/test_persona_presets.py tests/test_persona_settings.py tests/test_persona_template.py tests/test_persona_template_rendering.py tests/test_pet_interaction_locks.py tests/test_pet_profiles.py tests/test_pet_sprite.py tests/test_pet_sprite_geometry_memo.py tests/test_pet_sprite_hardening.py tests/test_physics.py tests/test_platform_mac_shadow.py tests/test_platform_passthrough.py tests/test_platform_win_busy_state.py tests/test_pr_report_discipline.py tests/test_predictive_prewarm.py tests/test_presentmon_packaging.py tests/test_proactive.py tests/test_proactive_memory_concurrency.py tests/test_profile_snapshot_normalization.py tests/test_qt_timer_refcount.py tests/test_quick_chat.py tests/test_quiet_mode.py tests/test_recovery_hints.py tests/test_requested_regressions.py tests/test_runtime.py tests/test_runtime_cleanup.py tests/test_runtime_dependencies.py tests/test_second_batch.py tests/test_self_talk_image_chance.py tests/test_self_talk_voice_precache.py tests/test_semantic_event_field_contract.py tests/test_session_end_ffmpeg_guard.py tests/test_session_lock_suspend.py tests/test_session_store_async.py tests/test_session_watcher_message_read.py tests/test_settings_and_resources.py tests/test_settings_copy_lint.py tests/test_settings_default_marks.py tests/test_settings_event_gating.py tests/test_settings_fps_permission.py tests/test_settings_game_fps.py tests/test_settings_ia_first_cut.py tests/test_settings_interaction_tabs.py tests/test_settings_network.py tests/test_settings_overlay_copy.py tests/test_settings_page_guide.py tests/test_settings_pet_tabs.py tests/test_settings_process_isolation.py

      - name: Pytest shard Q4 (Windows diag)
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        id: shard4
        run: python -m pytest -q --ignore=tests/test_ci_workflows.py tests/test_settings_process_isolation.py tests/test_settings_profile_integration.py tests/test_settings_reset_defaults.py tests/test_settings_search_aliases.py tests/test_settings_slot_config_route.py tests/test_settings_stale_form_exit.py tests/test_settings_subslot_autostart.py tests/test_single_pet_close_entry.py tests/test_single_process_shared.py tests/test_single_process_spawn.py tests/test_slot0_lifecycle.py tests/test_slot0_ownership.py tests/test_slot_and_memory.py tests/test_speech_bubble.py tests/test_sprite_acts_tail.py tests/test_sprite_animation_gap.py tests/test_sprite_behavior.py tests/test_sprite_bubble.py tests/test_sprite_click_turn_tail.py tests/test_sprite_collision.py tests/test_sprite_collision_id.py tests/test_sprite_dirty_rect.py tests/test_sprite_dpr.py tests/test_sprite_edge_probe.py tests/test_sprite_feeding.py tests/test_sprite_idle_tail.py tests/test_sprite_menu.py tests/test_sprite_menu_facade.py tests/test_sprite_menu_parity.py tests/test_sprite_menu_target.py tests/test_sprite_move_tail.py tests/test_sprite_physics.py tests/test_sprite_slingshot.py tests/test_sprite_sound.py tests/test_sprite_throw_egg.py tests/test_sprite_visibility.py tests/test_stream_capture_compat.py tests/test_stream_capture_copy.py tests/test_stream_capture_window_switch.py tests/test_switch_start_failure_window.py tests/test_sys_monitor.py tests/test_sys_monitor_gpu.py tests/test_throw_egg.py tests/test_throw_flight_anim.py tests/test_thrown_static_member_settle.py tests/test_tick_driver.py tests/test_tick_driver_idle_stop.py tests/test_tick_governor.py tests/test_tick_metrics.py tests/test_tick_power_aware.py tests/test_todo_reminder.py tests/test_tray_icon_ready.py tests/test_tray_settings_deferred_dispatch.py tests/test_uninstall_cleanup.py tests/test_update_feature.py tests/test_updater.py tests/test_verify_bundle_tts.py tests/test_vision.py tests/test_voice_chime.py tests/test_voice_chime_edge_voice.py tests/test_voice_chime_service.py tests/test_warm_landing_idles.py tests/test_wayland_platform.py tests/test_weather.py tests/test_weather_menu.py tests/test_weather_service.py tests/test_weather_settings.py tests/test_webm_clip_broker_feed.py tests/test_webm_clip_loop.py tests/test_webm_meta_cache.py tests/test_window_broker_wiring.py tests/test_window_dpr_signals.py tests/test_window_effects.py tests/test_window_pause.py tests/test_window_position.py tests/test_window_rendering.py tests/test_windows_node_env.py tests/test_winmm_sound.py

      # Linux 主套件失败后的**受限前缀**重跑（诊断，不是覆盖）：只跑收集序前缀
      # test_agent_cost → test_config_schema（44 个文件；本机 3.11 + offscreen 同口径
      # 实测 948 passed / 7 skipped / 2:27 全绿）。第三轮那次 abort 就落在该前缀的最后
      # 一个文件里（tests/test_config_schema.py::
      # test_reload_whitelist_snapshot_matches_current，面包屑只有 [call] 没有
      # [teardown]），-vv 会把崩溃点印成日志最后一行。
      # 限在前缀内是为了有界：Linux runner 跑到该前缀末位实测 91-104 s（round2/round3
      # 从 pytest 启动到 abort 的时间戳），最慢一轮整 job（Windows 17.6 min）加这
      # ~2.5 min 仍在 30 min 预算内。注意 round2 那次 abort 落在更靠后的
      # test_desktop_pet_features（前缀之外 10 个文件）——那种落点由主套件的 tee-sys
      # 原生日志取证，本步刻意不随崩点漂移扩大。
      # 红绿不变：主套件步骤自己的退出码决定 job 结果，本步无 continue-on-error、
      # 也不用 `||` 兜底。条件必须**显式**写 failure()：GitHub 在 `if:` 里没有状态
      # 函数时会隐式套一层 success()，前序步骤一红本步会被直接跳过——诊断恰恰要在
      # 红的时候跑。再加 `steps.main_suite.outcome == 'failure'`：只有主套件自己红
      # 才重跑这 ~2.5 min，ruff/bridge 门或隔离族红不再多烧一轮（outcome 而非
      # conclusion：前者是该步原始结果，不受 continue-on-error 影响）。
      # 独立 DSPET_TEST_DIAG_DIR：诊断重跑若没复现崩溃，不许把主套件那份面包屑
      # （「死在谁、哪个阶段」的唯一记录）覆盖成一份跑完通过的前缀记录。
      # 清单显式写出：改名/删除当场 exit 4 报错，不会静默缩水，也不会因 glob 落空
      # 退化成跑全量。新增测试文件落在该前缀内时同步此清单。
      - name: Pytest (Linux prefix diagnostics after main-suite failure)
        if: failure() && runner.os == 'Linux' && steps.main_suite.outcome == 'failure'
        env:
          DSPET_TEST_DIAG_DIR: ${{ runner.temp }}/dspet-pytest-diag-linux-prefix
        run: >-
          python -m pytest --capture=tee-sys -vv
          tests/test_agent_cost.py
          tests/test_agent_event_protocol.py
          tests/test_agent_link.py
          tests/test_agent_link_dep_specs.py
          tests/test_agent_link_subtraction.py
          tests/test_agent_link_threads.py
          tests/test_agent_settings_hot_reload.py
          tests/test_alert_queue.py
          tests/test_animation_icon_worker_lifecycle.py
          tests/test_animation_menu_close_and_group.py
          tests/test_animation_prewarm_phase2.py
          tests/test_animation_thumbnail_cache.py
          tests/test_api_provider_list.py
          tests/test_app_lazy_imports.py
          tests/test_app_startup_fallback.py
          tests/test_architecture.py
          tests/test_autostart.py
          tests/test_background_service_gates.py
          tests/test_balance.py
          tests/test_bubble_subtitle_budget.py
          tests/test_bubble_text_scale.py
          tests/test_bundle_encoding_check.py
          tests/test_bundle_slim.py
          tests/test_chat_attachments.py
          tests/test_chat_safe_emit.py
          tests/test_chat_service.py
          tests/test_chat_shared_behavior.py
          tests/test_chat_subsystem.py
          tests/test_chat_themes.py
          tests/test_child_bubble_quick_chat.py
          tests/test_ci_workflows.py
          tests/test_cleanup_mei_cache_cli.py
          tests/test_click_self_talk_speech.py
          tests/test_click_sound.py
          tests/test_click_talk_dialog.py
          tests/test_clip_current_image.py
          tests/test_clip_restart_paths.py
          tests/test_collision.py
          tests/test_collision_debounce_timebase.py
          tests/test_config_concurrent_save.py
          tests/test_config_instance.py
          tests/test_config_key_migration.py
          tests/test_config_reload_null.py
          tests/test_config_schema.py

      # webm 生命周期族（reader/ffmpeg 进程 teardown 竞态）在 macOS CI 上
      # 偶发段错误（exit 139，栈在 reader 线程 + imageio LogCatcher）。
      # 段错误会杀掉整个 pytest 进程、拖垮主套件的结果报告，因此拆成
      # 独立步骤：崩溃时只隔离失败这一步，主套件结果照常产出。
      # 注意：拆步骤不改变测试内容，不掩盖失败——该红还是红。
      - name: Pytest (webm lifecycle family, isolated)
        run: python -m pytest -q --ignore=tests/test_ci_workflows.py tests/test_webm_reader_lifecycle.py tests/test_webm_clip_lifecycle.py tests/test_webm_first_frame_lock.py

      # 低优预热让路族（test_low_priority_warm_interaction_yield.py）依赖真实
      # 线程编舞（worker 阻塞/放行），断言本身正确但时序窗口在 CI 满载 runner
      # 上会被极度拉长（本地与 ubuntu 稳过、windows CI 偶发批次起步超时）。
      # 隔离 + 允许一次重跑：重跑仍红才算真失败，避免时序抖动拖垮 PR 门禁。
      - name: Pytest (low-priority warm family, isolated + one retry)
        run: python -m pytest -q --ignore=tests/test_ci_workflows.py tests/test_low_priority_warm_interaction_yield.py || python -m pytest -q tests/test_low_priority_warm_interaction_yield.py

      # frameseq 崩溃家族已根治（2026-10-04，docs/PR-REPORT-QT-LIFECYCLE-CRASH-FAMILY）：
      # 根因 = 丢弃未收口的 clip/worker 被 GC 析构时撞上共享预取线程的在途 queued
      # 交付（mac 原生栈实锤 qtPythonMetacall 0x8 空解引用）；修复 = 进程级强钉 +
      # 退役制收口。肇事单条回归主套件（不再 deselect）。本步骤保留为 frameseq 族
      # 的独立重跑位（崩溃杀进程时主套件报告不受影响），照跑照判红。
      - name: Pytest (frameseq native-crash isolates, isolated + one retry)
        run: python -m pytest -q --ignore=tests/test_ci_workflows.py tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py || python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py

      # 放在所有 pytest 步骤之后，主套件或隔离族失败均可回读最后运行的面包屑。
      # 失败详情由 conftest 当刻写 stderr；这里只读末尾，不输出两万多行。
      # 两个目录都回读：主套件那份（dspet-pytest-diag）与 Linux 受限前缀重跑那份
      # （dspet-pytest-diag-linux-prefix，只有前缀步骤真跑过才存在）。前缀重跑若
      # 没复现崩溃，主套件那份仍是「死在谁、哪个阶段」的唯一记录——只读其中一份
      # 就会漏掉另一半现场。
      - name: Pytest crash diagnostics
        if: failure()
        shell: bash
        run: |
          for NAME in dspet-pytest-diag dspet-pytest-diag-linux-prefix; do
            DIR="${RUNNER_TEMP:-$TMPDIR}/$NAME"
            if [ -f "$DIR/pytest-breadcrumb.txt" ]; then
              echo "::group::$NAME/pytest-breadcrumb.txt (tail -30)"
              tail -n 30 "$DIR/pytest-breadcrumb.txt"
              echo "::endgroup::"
            fi
          done

