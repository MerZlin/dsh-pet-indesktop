name: Build Linux App

on:
  workflow_dispatch:        # 手动触发（Actions 页面 → Run workflow）
  push:
    tags:
      - 'v*'                # 打 tag 时自动触发并发布 Release

permissions:
  contents: write           # 用于创建 Release 上传产物

jobs:
  build-linux:
    runs-on: ubuntu-latest  # x86_64；PyInstaller 不支持交叉编译，必须在 Linux 上构建
    # 编码隔离（issue #26）：强制 UTF-8 模式，避免任何环节按 legacy 编码
    # 二次解码中文源码/资源（PYTHONIOENCODING 只解决控制台输出）。
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PySide6 在 Linux 上 import 需要系统 EGL/GL 等库（裸 runner 没有）；
      # 构建 Fcitx 插件还需要 CMake、ECM 和 Qt6 私有开发头文件。
      - name: Install system libraries (PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 fonts-noto-cjk cmake extra-cmake-modules qt6-base-private-dev libxkbcommon-dev libxcb1-dev libx11-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      # 桥接插件依赖（issue: Cannot find package '@deepseek-ai/cosmokit'）：
      # fix_bridge_bundle.py 需要源码 node_modules 展开复制进 dist；
      # --frozen-lockfile 让 lock 与 package.json 失配时直接失败。
      - name: Install bridge plugin dependencies
        run: |
          node --version
          npm install -g pnpm
          pnpm --version
          cd integrations/dsh-pet-bridge
          pnpm install --frozen-lockfile

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # 构建入口与本地完全一致：scripts/build_linux.sh（PyInstaller 打包 +
      # 中文编码自检都在脚本内完成），CI 不内联任何构建命令，
      # 避免本地/CI 两套逻辑漂移。只构建两个 webm 变体（与 Windows/macOS
      # 发布一致，GIF 包体约 800 MB 不发布）。
      # onedir 形态：运行期零解压、不产生临时缓存；build_variant.py 注入
      # 变体标识，配置目录/自启项按变体隔离（与 Windows/macOS 行为一致）。
      # Linux 上 PyInstaller 忽略 --icon（只对 Windows/macOS 生效），故省略。
      - name: Build onedir variants
        run: |
          bash scripts/build_linux.sh \
            --dist dist \
            --variants webm-chat,webm

      - name: Verify pet module collected
        run: |
          for VARIANT in webm-chat webm; do
            APP="dsh-pet-standalone-$VARIANT"
            WARN="$(find build -name "warn-$APP.txt" | head -1)"
            if [ -n "$WARN" ] && grep -q "missing module named pet" "$WARN"; then
              echo "::error::$APP pet 模块未被 PyInstaller 收集"; cat "$WARN"; exit 1
            fi
            echo "$APP pet 模块已收集"
            if ! find dist -path "*integrations/dsh-pet-bridge/package.json" | grep -q .; then
              echo "::error::$APP 未打包 integrations/dsh-pet-bridge，DSH 桥接一键安装必然失败"; exit 1
            fi
            echo "$APP 桥接插件资源已打包"
            # Fcitx 插件必须与 PySide6 Qt 一起分发，Linux Fcitx 用户才能输入中文。
            IME_PLUGIN="dist/$APP/_internal/PySide6/Qt/plugins/platforminputcontexts/libfcitx5platforminputcontextplugin.so"
            if [ ! -f "$IME_PLUGIN" ]; then
              echo "::error::$APP 未打包 Fcitx5 输入法插件，中文输入必然失败"; exit 1
            fi
            echo "$APP Fcitx5 输入法插件已打包"
          done

      - name: Package as zip
        run: |
          cd dist
          for VARIANT in webm-chat webm; do
            zip -r "dsh-pet-standalone-$VARIANT-linux-x86_64.zip" "dsh-pet-standalone-$VARIANT"
          done

      - name: Verify zip preserves executable permission
        run: |
          for ZIP in dist/dsh-pet-standalone-*-linux-x86_64.zip; do
            rm -rf /tmp/verify && mkdir -p /tmp/verify
            cd /tmp/verify
            unzip -q "$GITHUB_WORKSPACE/$ZIP"
            DIR="${ZIP##*/}"; DIR="${DIR%-linux-x86_64.zip}"
            BIN="$DIR/$DIR"
            ls -l "$BIN"
            if [ ! -x "$BIN" ]; then
              echo "::error::$ZIP 解压后二进制丢失可执行权限"; exit 1
            fi
            echo "$ZIP 可执行权限保留"
            cd "$GITHUB_WORKSPACE"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-standalone-linux-x86_64
          path: dist/*.zip
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
