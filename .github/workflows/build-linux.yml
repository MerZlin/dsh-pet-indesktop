name: Build Linux App

on:
  workflow_dispatch:        # 手动触发（Actions 页面 → Run workflow）
    inputs:
      source_ref:
        description: '要构建的 ref/SHA（留空 = 本 workflow 的触发 ref，即默认检出）'
        required: false
        type: string
        default: ''
      upload_artifacts:
        description: '把产物上传为 Actions artifact（tag 推送始终上传；手动默认否）'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'                # 打 tag 时自动触发并发布 Release

permissions:
  contents: write           # 用于创建 Release 上传产物

jobs:
  build-linux:
    # issue #432（2026-11-10 定位）：Linux 包的 glibc 基线 = 构建机基线——
    # PyInstaller 在 Linux 上会把构建机上解析到的系统库整份拷进 _internal/。
    # ubuntu-latest 别名已整体漂到 24.04（glibc 2.38），Ubuntu 22.04 用户启动即
    # `GLIBC_2.38 not found`（从第一个 Linux 包起就没在 22.04 上跑起来过）。
    # 基线必须钉死在容器镜像上：jammy 全生命周期 glibc 恒为 2.35，而
    # runs-on: ubuntu-22.04 那类托管镜像会被 GitHub 退役，退役即静默复发。
    # 产物地板由 scripts/check_elf_symbol_floor.py 在 build_linux.sh 里硬门。
    runs-on: ubuntu-latest  # x86_64 宿主；实际构建环境 = 下面的 22.04 容器
    container: ubuntu:22.04  # = 发布基线：glibc 2.35 / libstdc++ GLIBCXX 3.4.30
    # 编码隔离（issue #26）：强制 UTF-8 模式，避免任何环节按 legacy 编码
    # 二次解码中文源码/资源（PYTHONIOENCODING 只解决控制台输出）。
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      # 必须排在 Checkout 之前：jammy 裸容器没有 git，actions/checkout 会退化成
      # 「下载仓库 tarball 解压」——不留 .git 目录，后续 git rev-parse / 插件脚本的
      # git clone 都会挂。容器内以 root 运行（无 sudo）。
      # PySide6 在 Linux 上 import 需要系统 EGL/GL 等库；构建 Fcitx 插件还需要
      # CMake、ECM 和 Qt6 私有开发头文件；binutils 的 readelf/nm 供 ELF 符号版本
      # 门禁与插件自检，zstd 供 actions/cache，zip/unzip 供打包与校验步骤。
      - name: Install container toolchain + system libraries (PySide6)
        run: |
          # noninteractive：tzdata 安装时会交互式询问地区，无 tty 的 CI 里必须关掉。
          # tzdata 必须装：宿主 runner 自带完整 zoneinfo，裸容器没有——测试里的
          # TZ=Asia/Shanghai + time.tzset() 会解析失败退回 UTC，差 8 小时。
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git perl binutils build-essential zip unzip zstd ca-certificates curl tzdata libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 fonts-noto-cjk cmake extra-cmake-modules qt6-base-dev qt6-base-private-dev libgl1-mesa-dev libxkbcommon-dev libxcb1-dev libx11-dev
          # qt6-base-dev + libgl1-mesa-dev 必须显式写：jammy 的 qt6-base-private-dev
          # 不连带它们（noble 连带，老 workflow 因此没写）——Fcitx 插件的
          # find_package(Gui Widgets) 会先因缺 Qt6Gui/Qt6Widgets 的 cmake config、
          # 再因 Qt6Gui 依赖 WrapOpenGL 缺 GL 头文件而两级失败。
          # 容器内以 root 运行，工作区文件属主是宿主 runner 用户（UID 不同），
          # git 会以 dubious ownership 拒绝 rev-parse —— 全局放行本工作区一次。
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动构建用 source_ref 指定要构建的树（三端对齐同一提交）；留空即回落
          # github.sha（= 事件默认检出的提交，tag 推送时就是该 tag 指向的提交）。
          ref: ${{ github.event.inputs.source_ref || github.sha }}

      # 不用 actions/setup-python（issue #432 的第二个元凶）：它的 CPython 工件
      # 本身已被上游迁到 24.04 基线重编（libpython3.11.so.1.0 要求 GLIBC_2.38），
      # 在 22.04 容器里连启动都过不了。uv 管的 CPython（python-build-standalone
      # 系）实测 libpython 底线 GLIBC_2.17，且带校验和、不受上游重编漂移影响。
      # venv bin 前置进 PATH 后，后续步骤与 build_linux.sh（PYTHON_BIN 默认取
      # PATH 的 python3）零改动。
      - name: Setup uv
        # 精确 pin：setup-uv 上游不维护 vN 浮动主版本 tag（只有 vX.Y.Z），
        # 写 @v10 会在 job 装配期直接解析失败。
        uses: astral-sh/setup-uv@v10.3.3

      - name: Create venv (uv CPython 3.11) and install dependencies
        run: |
          uv python install 3.11
          uv venv .venv-ci --python 3.11
          uv pip install --python .venv-ci/bin/python -r requirements.txt pyinstaller pytest
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"

      # 记录「这次构建的是哪棵树 + 到底装了什么」：三端 artifact 能不能对上要看
      # SHA；而 requirements.txt 全是 `>=` 无上限、无 lock，三端各自解析最新
      # 兼容版（imageio-ffmpeg 每平台还是不同的 ffmpeg 构建）。
      - name: Record resolved source SHA and toolchain
        shell: bash
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          uv pip freeze --python .venv-ci/bin/python > "$RUNNER_TEMP/pip-freeze.txt"
          {
            echo "### ${{ runner.os }} 构建输入"
            echo ""
            echo "- event: ${{ github.event_name }}"
            echo "- ref: ${{ github.ref }}"
            echo "- github.sha: ${{ github.sha }}"
            echo "- checkout HEAD: $HEAD_SHA"
            echo "- python: $(python --version 2>&1)（uv 管理）"
            echo "- 容器基线: ubuntu:22.04（glibc $(ldd --version | head -1)）"
            echo ""
            echo "<details><summary>pip freeze</summary>"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/pip-freeze.txt"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # 命令与 PR 门禁（pr-test.yml）保持同一套：时序 flake 家族从主套件里
      # 隔离成独立步骤——它们会让整个 pytest 进程原生崩溃（exit 139/access
      # violation），从而拖垮同一进程里其它测试的结果报告。隔离不掩盖失败：
      # 每一族照常判红，只额外给一次重跑机会（与门禁一致）。
      - name: Pytest (main suite)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --ignore=tests/test_webm_reader_lifecycle.py --ignore=tests/test_webm_clip_lifecycle.py --ignore=tests/test_webm_first_frame_lock.py --ignore=tests/test_low_priority_warm_interaction_yield.py

      - name: Pytest (webm lifecycle family, isolated + one retry)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_webm_reader_lifecycle.py tests/test_webm_clip_lifecycle.py tests/test_webm_first_frame_lock.py || python -m pytest -q tests/test_webm_reader_lifecycle.py tests/test_webm_clip_lifecycle.py tests/test_webm_first_frame_lock.py

      - name: Pytest (low-priority warm family, isolated + one retry)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_low_priority_warm_interaction_yield.py || python -m pytest -q tests/test_low_priority_warm_interaction_yield.py

      # frameseq 原生崩溃隔离位：肇事者系 test_frameseq_clip.py 单条用例
      # （verbose 复现钉死；watchdog 族系位置误判已排除，回归主套件）。
      # 详见 pr-test.yml 同名单元注释，按族先例隔离 + 一次重跑。
      - name: Pytest (frameseq native-crash isolates, isolated + one retry)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py::test_retained_frame_is_not_reused_as_frame_zero || python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py::test_retained_frame_is_not_reused_as_frame_zero

      # 帧序列素材供给（三端同一口径，2026-10-11）：frameseq/ 是刻意不入库的派生
      # 产物（.gitignore），干净检出里必然没有；构建对素材整树拷贝
      # assets/characters，缺了也不报错——不补这一步就会打出缺素材的静默降级包。
      # 缓存 key 由脚本按「源 webm 摘要 + 转换器/供给实现 + 编码档 + 平台/Python/
      # Pillow/imageio-ffmpeg 版本」算出：命中即近零成本，未命中才重转 106 段
      # （冷缓存约 28 min）。缓存里是本仓库公开源素材的派生物，不含任何 secret，
      # 且缓存只是构建期缓存、不是发布产物。
      # 发布形态 = 精简内置（2026-10-22 定）：只带 core 闭包五类（idle/move/turn/
      # click/drag，共 11 段），events/random 由素材包按需安装。必须在算缓存 key
      # 之前删——源摘要不同，缓存命名空间随之分开。
      - name: Slim bundled assets to core closure
        shell: bash
        run: |
          rm -rf assets/characters/shenshen/frameseq/events assets/characters/shenshen/frameseq/random
          rm -rf assets/characters/shenshen/videos/events assets/characters/shenshen/videos/random

      - name: Compute frameseq cache key
        id: frameseq-cache
        shell: bash
        run: echo "key=$(python scripts/prepare_frameseq_bundle.py --print-cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore frameseq material cache
        uses: actions/cache@v4
        with:
          path: assets/characters/*/frameseq
          key: ${{ steps.frameseq-cache.outputs.key }}

      # 先验完整（命中即跳过转换）→ 缺才转 → 转完再验；坏缓存不会被盲跳过，
      # 命令的真实退出码原样冒泡。两个变体共用这一次素材准备，不重复转。
      - name: Prepare frameseq material
        shell: bash
        run: python scripts/prepare_frameseq_bundle.py --character shenshen --include ""

      # 构建入口与本地完全一致：scripts/build_linux.sh（PyInstaller 打包 +
      # 中文编码自检都在脚本内完成），CI 不内联任何构建命令，
      # 避免本地/CI 两套逻辑漂移。只构建两个 webm 变体（与 Windows/macOS
      # 发布一致，GIF 包体约 800 MB 不发布）。
      # onedir 形态：运行期零解压、不产生临时缓存；build_variant.py 注入
      # 变体标识，配置目录/自启项按变体隔离（与 Windows/macOS 行为一致）。
      # Linux 上 PyInstaller 忽略 --icon（只对 Windows/macOS 生效），故省略。
      - name: Build onedir variants
        run: |
          bash scripts/build_linux.sh \
            --dist dist \
            --variants webm-chat,webm

      - name: Verify pet module collected
        run: |
          for VARIANT in webm-chat webm; do
            APP="dsh-pet-standalone-$VARIANT"
            WARN="$(find build -name "warn-$APP.txt" | head -1)"
            if [ -n "$WARN" ] && grep -q "missing module named pet" "$WARN"; then
              echo "::error::$APP pet 模块未被 PyInstaller 收集"; cat "$WARN"; exit 1
            fi
            echo "$APP pet 模块已收集"
            if ! find dist -path "*integrations/dsh-pet-bridge/package.json" | grep -q .; then
              echo "::error::$APP 未打包 integrations/dsh-pet-bridge，DSH 桥接一键安装必然失败"; exit 1
            fi
            echo "$APP 桥接插件资源已打包"
            # Fcitx 插件必须与 PySide6 Qt 一起分发，Linux Fcitx 用户才能输入中文。
            IME_PLUGIN="dist/$APP/_internal/PySide6/Qt/plugins/platforminputcontexts/libfcitx5platforminputcontextplugin.so"
            if [ ! -f "$IME_PLUGIN" ]; then
              echo "::error::$APP 未打包 Fcitx5 输入法插件，中文输入必然失败"; exit 1
            fi
            echo "$APP Fcitx5 输入法插件已打包"
          done

      - name: Package as zip
        run: |
          cd dist
          for VARIANT in webm-chat webm; do
            zip -r "dsh-pet-standalone-$VARIANT-linux-x86_64.zip" "dsh-pet-standalone-$VARIANT"
          done

      - name: Verify zip preserves executable permission
        run: |
          for ZIP in dist/dsh-pet-standalone-*-linux-x86_64.zip; do
            rm -rf /tmp/verify && mkdir -p /tmp/verify
            cd /tmp/verify
            unzip -q "$GITHUB_WORKSPACE/$ZIP"
            DIR="${ZIP##*/}"; DIR="${DIR%-linux-x86_64.zip}"
            BIN="$DIR/$DIR"
            ls -l "$BIN"
            if [ ! -x "$BIN" ]; then
              echo "::error::$ZIP 解压后二进制丢失可执行权限"; exit 1
            fi
            echo "$ZIP 可执行权限保留"
            cd "$GITHUB_WORKSPACE"
          done

      # 产物默认不上传：手动 dispatch 是验证用途，往公共仓库 Actions 堆大产物
      # 没有收益（也就把刻意不入库的素材树带上去了）。tag 推送照旧上传，
      # 手动要上传必须显式打开 upload_artifacts——即使把运行 ref 选到某个已有
      # tag 上手动跑也一样（github.ref 在那里同样带 refs/tags/ 前缀，所以条件
      # 必须先要求 event_name == 'push'，不能只看 ref 前缀）。
      - name: Upload artifact
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-standalone-linux-x86_64
          path: dist/*.zip
          retention-days: 30

      # 只有 tag 推送才发布 Release：手动 dispatch 是验证用途，即使把 ref 指到
      # 某个 tag 上手动跑，也不许创建/改写 Release。
      - name: Publish Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          # 草稿：构建完只挂附件，发布由维护者核对后手动 publish；
          # generate_release_notes 必须关——否则会覆盖维护者写的发布正文。
          draft: true
          generate_release_notes: false
