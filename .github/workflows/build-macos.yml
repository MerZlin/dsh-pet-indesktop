name: Build macOS App

on:
  workflow_dispatch:        # 手动触发（Actions 页面 → Run workflow）
  push:
    tags:
      - 'v*'                # 打 tag 时自动触发并发布 Release

permissions:
  contents: write           # 用于创建 Release 上传产物

jobs:
  build-macos:
    runs-on: macos-latest   # Apple Silicon（arm64）；Intel 用户请用源码运行

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 imageio-ffmpeg pillow pyinstaller

      - name: Fetch source webm from upstream dsh-pet
        run: |
          git clone --depth 1 https://github.com/PC2005-cloud/dsh-pet.git /tmp/dsh-pet
          mkdir -p assets/videos
          if [ -d /tmp/dsh-pet/dsh-pet/assets/thumb ]; then
            cp /tmp/dsh-pet/dsh-pet/assets/thumb/*.webm assets/videos/
          elif [ -d /tmp/dsh-pet/assets/thumb ]; then
            cp /tmp/dsh-pet/assets/thumb/*.webm assets/videos/
          else
            echo "::error::未找到上游 webm 目录"; exit 1
          fi
          echo "webm 数量: $(ls assets/videos/ | wc -l)"

      - name: Convert webm to GIF
        run: python scripts/convert.py

      - name: Build .app with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --paths . \
            --name "dsh-pet-indesktop" \
            --add-data "assets/animations:assets/animations" \
            packaging/pet_entry.py

      - name: Verify pet module collected
        run: |
          WARN="build/dsh-pet-indesktop/warn-dsh-pet-indesktop.txt"
          if [ -f "$WARN" ] && grep -q "missing module named pet" "$WARN"; then
            echo "::error::pet 模块未被 PyInstaller 收集"; cat "$WARN"; exit 1
          fi
          echo "pet 模块已收集"

      - name: Ad-hoc codesign (no Apple Developer cert needed)
        run: |
          codesign --force --deep --sign - "dist/dsh-pet-indesktop.app"

      - name: Package as zip (ditto preserves permissions & symlinks)
        run: |
          cd dist
          ditto -c -k --keepParent dsh-pet-indesktop.app dsh-pet-indesktop-macos-arm64.zip

      - name: Verify zip preserves executable permission
        run: |
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          cd /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/dist/dsh-pet-indesktop-macos-arm64.zip"
          BIN="dsh-pet-indesktop.app/Contents/MacOS/dsh-pet-indesktop"
          ls -l "$BIN"
          if [ ! -x "$BIN" ]; then
            echo "::error::解压后二进制丢失可执行权限"; exit 1
          fi
          echo "可执行权限保留"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-indesktop-macos-arm64
          path: dist/*.zip
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
