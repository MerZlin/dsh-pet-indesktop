[pytest]
testpaths = tests
norecursedirs = dist build dist-onedir build-onedir _internal *.egg-info .git .venv .mypy_cache .pytest_cache __pycache__

markers =
    unit: pure logic and isolated component tests
    integration: tests that exercise multiple in-process components or Qt lifecycle
    e2e: tests that exercise process, IPC, or application-boundary behavior
    slow: tests with intentionally long media, timing, or resource budgets
    platform: tests whose behavior depends on a specific operating system or desktop backend
    external: tests that cross a third-party, subprocess, media, or system boundary
    network: tests covering network clients or network-facing integration boundaries
